<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お気に入り物件</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-header">
    <div class="popup-brand">
      <img src="icons/icon32.png" alt="" class="popup-brand-icon">
      <h1>坪たん</h1>
    </div>
    <button id="extension-version" class="extension-version" type="button" aria-label="リリースノートを表示"></button>
  </div>

  <div class="view-tabs" role="tablist" aria-label="表示切替">
    <button class="view-tab active" type="button" data-view="favorites" role="tab" aria-selected="true">候補</button>
    <button class="view-tab" type="button" data-view="compare" role="tab" aria-selected="false">比較</button>
    <button class="view-tab" type="button" data-view="checklist" role="tab" aria-selected="false">内見</button>
  </div>

  <section class="summary-strip" aria-label="候補サマリー">
    <div class="summary-card">
      <span class="summary-label">候補</span>
      <strong id="summary-total">0</strong>
    </div>
    <div class="summary-card summary-card--down">
      <span class="summary-label">値下がり</span>
      <strong id="summary-price-drops">0</strong>
    </div>
    <div class="summary-card summary-card--viewing">
      <span class="summary-label">内見メモ</span>
      <strong id="summary-viewings">0</strong>
    </div>
  </section>

  <div class="filter-bar">
    <button class="filter-btn active" data-site="all">全て</button>
    <button class="filter-btn" data-site="SUUMO">SUUMO</button>
    <button class="filter-btn" data-site="REHOUSE">リハウス</button>
    <button class="filter-btn" data-site="ATHOME">アットホーム</button>
    <button class="filter-btn" data-site="HOMES">ホームズ</button>
  </div>

  <main class="popup-scroll">
    <div id="favorites-view" class="popup-view">
    <div class="sort-bar">
      <label for="sort-select" class="sort-label">並び順</label>
      <select id="sort-select" class="sort-select">
        <option value="added_desc">追加日が新しい順</option>
        <option value="price_desc">価格が高い順</option>
        <option value="price_asc">価格が安い順</option>
        <option value="tsubo_asc">坪単価が安い順</option>
        <option value="updated_desc">価格改定が新しい順</option>
      </select>
    </div>

    <section class="loan-settings" aria-label="住宅ローン条件">
      <div class="loan-settings-header">
        <h2>ローン条件</h2>
        <span id="loan-settings-status" class="loan-settings-status"></span>
      </div>
      <div class="loan-settings-grid">
        <label class="loan-setting-field">
          <span>金利</span>
          <div class="loan-setting-input-wrap">
            <input type="number" id="loan-rate" min="0" max="5" step="0.1">
            <span>%</span>
          </div>
        </label>
        <label class="loan-setting-field">
          <span>返済</span>
          <div class="loan-setting-input-wrap">
            <input type="number" id="loan-years" min="1" max="50" step="1">
            <span>年</span>
          </div>
        </label>
        <label class="loan-setting-field">
          <span>頭金</span>
          <div class="loan-setting-input-wrap">
            <input type="number" id="loan-down-payment" min="0" step="100">
            <span>万円</span>
          </div>
        </label>
      </div>
    </section>

    <div id="favorites-list" class="favorites-list"></div>
    <div id="empty-message" class="empty-message" style="display: none;">
      お気に入りはまだありません
    </div>
    </div>

    <div id="compare-view" class="popup-view" hidden>
      <div id="compare-board" class="compare-board"></div>
      <div id="compare-empty-message" class="empty-message" style="display: none;">
        比較できるお気に入りはまだありません
      </div>
    </div>

    <div id="checklist-view" class="popup-view" hidden>
      <div id="checklist-list" class="checklist-list"></div>
      <div id="checklist-empty-message" class="empty-message" style="display: none;">
        内見チェックできるお気に入りはまだありません
      </div>
    </div>

    <div class="site-badge-preview" aria-label="サイト上のバッジ例">
      <span>サイト上のバッジ</span>
      <strong>坪単価 362万円</strong>
      <strong>月額 30.1万円</strong>
      <em>修繕 要確認</em>
    </div>
  </main>

  <div class="popup-action-bar">
    <button id="recheck-favorites" class="popup-action" type="button">再チェック</button>
    <button id="export-favorites-csv" class="popup-action" type="button">CSV</button>
    <button id="open-side-panel" class="popup-action popup-action--primary" type="button">Side Panelで比較</button>
  </div>
  <span id="recheck-status" class="watch-status" aria-live="polite"></span>

  <div id="release-notes-dialog" class="release-notes-dialog" role="dialog" aria-modal="true" aria-labelledby="release-notes-title" hidden>
    <div class="release-notes-panel">
      <div class="release-notes-header">
        <h2 id="release-notes-title">更新内容</h2>
        <button id="release-notes-close" class="release-notes-close" type="button" aria-label="閉じる">×</button>
      </div>
      <div id="release-notes-body" class="release-notes-body"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
