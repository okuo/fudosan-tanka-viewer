name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag version ($tag_version) does not match manifest.json version ($manifest_version)"
            exit 1
          fi
          echo "Version verified: $tag_version"

      - name: Run JavaScript smoke tests
        run: |
          node --check content.js
          node --check popup.js
          node --check background.js
          node --check tests/e2e_extension.js
          node test_csv_export.js
          node test_background.js

      - name: Build zip
        run: bash build.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: fudosan-tanka-viewer.zip
          generate_release_notes: true

      - name: Upload and publish to Chrome Web Store
        run: python3 .github/scripts/chrome_web_store_release.py
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PACKAGE_PATH: fudosan-tanka-viewer.zip
          CWS_AUTO_PUBLISH: ${{ vars.CWS_AUTO_PUBLISH }}
          CWS_PUBLISH_TYPE: ${{ vars.CWS_PUBLISH_TYPE }}
          CWS_DEPLOY_PERCENTAGE: ${{ vars.CWS_DEPLOY_PERCENTAGE }}
          CWS_SKIP_REVIEW: ${{ vars.CWS_SKIP_REVIEW }}
          CWS_BLOCK_ON_WARNINGS: ${{ vars.CWS_BLOCK_ON_WARNINGS }}
