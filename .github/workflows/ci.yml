name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json is valid JSON
        run: python3 -c "import json; json.load(open('manifest.json'))"

      - name: Validate manifest.json version format
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version format: $version (expected X.Y.Z)"
            exit 1
          fi
          echo "Version: $version"

      - name: Check required files exist
        run: |
          missing=0
          for f in content.js styles.css manifest.json popup.html popup.js popup.css icons/icon16.png icons/icon48.png icons/icon128.png; do
            if [ ! -f "$f" ]; then
              echo "::error::Required file missing: $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then exit 1; fi
          echo "All required files present."

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: bash build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fudosan-tanka-viewer
          path: fudosan-tanka-viewer.zip
